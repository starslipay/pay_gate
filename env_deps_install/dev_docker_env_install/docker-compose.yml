# 本地先安装docker desktop
# 在本地构建并启动所有依赖组件
# 删除所有容器和数据卷 docker-compose down -v
# 部署所有容器 docker-compose up -d

# 统一内网，各服务互通
networks:
  dev_pay_net:
    driver: bridge
    name: dev_pay_net

# 持久化数据卷
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  kafka_data:
  zk_data:
  prom_data:  # prometheus时序数据持久化
  graf_data:  # grafana面板配置持久化
  loki_data:  # loki日志数据持久化
  promtail_data:  # promtail采集位置持久化
  tempo_data:  # tempo链路追踪数据持久化

services:
  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai  
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: user_db
      MYSQL_USER: starslipay
      MYSQL_PASSWORD: starslipay123456
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --transaction-isolation=READ-COMMITTED
    networks:
      - dev_pay_net

  # Redis 6
  redis:
    image: redis:6-alpine
    container_name: redis6
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - dev_pay_net

  # Etcd 3.5 分布式注册中心【新增command解决报错】
  etcd:
    image: registry.aliyuncs.com/google_containers/etcd:3.5.6-0
    container_name: etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      TZ: Asia/Shanghai
      ALLOW_NONE_AUTHENTICATION: yes
      ETCD_NAME: etcd-node1
      ETCD_DATA_DIR: /etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-node1=http://etcd:2380
    volumes:
      - etcd_data:/etcd/data
    # 关键修复：添加etcd启动命令
    command:
      - /usr/local/bin/etcd
    networks:
      - dev_pay_net

  # Kafka 3.8.0 (KRaft mode, no Zookeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: kafka-cluster-001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    user: root
    networks:
      - dev_pay_net

  # Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: always
    ports:
      - "9091:9090"  # 宿主机访问 http://localhost:9091
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - dev_pay_net

  # Grafana 可视化面板
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: always
    ports:
      - "31000:3000"  # 宿主机访问 http://localhost:3000
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - graf_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - dev_pay_net

  # Loki 日志存储
  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    restart: always
    ports:
      - "3100:3100"  # Loki API
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dev_pay_net

  # Promtail 日志采集
  promtail:
    image: grafana/promtail:2.9.10
    container_name: promtail
    restart: always
    ports:
      - "9080:9080"  # Promtail Web UI
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - dev_pay_net

  # Tempo 链路追踪
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    restart: always
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"  # Tempo API (查询接口)
      - "4317:4317"  # OTLP gRPC (go-zero 发送 trace)
      - "4318:4318"  # OTLP HTTP (go-zero 发送 trace)
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - dev_pay_net
