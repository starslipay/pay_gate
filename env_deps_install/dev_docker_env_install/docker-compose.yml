# 本地先安装docker desktop
# 在本地构建并启动所有依赖组件
# 删除所有容器和数据卷 docker-compose down -v
# 部署所有容器 docker-compose up -d

# 统一内网，各服务互通
networks:
  dev_pay_net:
    driver: bridge
    name: dev_pay_net

# 持久化数据卷
volumes:
  mysql_master_data: # MySQL 主库数据
  mysql_slave1_data: # MySQL 从库1数据
  mysql_slave2_data: # MySQL 从库2数据
  redis_master_data: # Redis 主节点数据
  redis_slave1_data: # Redis 从节点1数据
  redis_slave2_data: # Redis 从节点2数据
  etcd1_data: # etcd 节点1数据
  etcd2_data: # etcd 节点2数据
  etcd3_data: # etcd 节点3数据
  kafka1_data: # Kafka 节点1数据
  kafka2_data: # Kafka 节点2数据
  kafka3_data: # Kafka 节点3数据
  zk_data:
  prom_data: # prometheus时序数据持久化
  graf_data: # grafana面板配置持久化
  loki_data: # loki日志数据持久化
  promtail_data: # promtail采集位置持久化
  tempo_data:
    # tempo链路追踪数据持久化

services:
  # MySQL 8.0 主库 (半同步复制 - 主端)
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: user_db
      MYSQL_USER: starslipay
      MYSQL_PASSWORD: starslipay123456
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/init/master:/docker-entrypoint-initdb.d:ro
      - ./mysql/runtime/semi_sync_master.sql:/etc/mysql/semi_sync_init.sql:ro
    # Windows 下挂载 cnf 文件会因权限过宽被 MySQL 忽略, 故全部用 command 参数
    # 半同步插件通过 init SQL 的 INSTALL PLUGIN 安装, 变量通过 --init-file 每次启动时设置
    command: >
      --default-authentication-plugin=mysql_native_password --transaction-isolation=READ-COMMITTED --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --max-connections=1000 --init-file=/etc/mysql/semi_sync_init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - dev_pay_net

  # MySQL 8.0 从库1 (半同步复制 - 从端, 只读)
  mysql-slave1:
    image: mysql:8.0
    container_name: mysql-slave1
    restart: always
    ports:
      - "3307:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
      # 从库不设置 MYSQL_DATABASE/MYSQL_USER, 所有数据通过复制从主库同步
    volumes:
      - mysql_slave1_data:/var/lib/mysql
      - ./mysql/init/slave:/docker-entrypoint-initdb.d:ro
      - ./mysql/runtime/semi_sync_slave.sql:/etc/mysql/semi_sync_init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password --transaction-isolation=READ-COMMITTED --server-id=2 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --max-connections=1000 --read-only=1 --super-read-only=1 --init-file=/etc/mysql/semi_sync_init.sql
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # MySQL 8.0 从库2 (半同步复制 - 从端, 只读)
  mysql-slave2:
    image: mysql:8.0
    container_name: mysql-slave2
    restart: always
    ports:
      - "3308:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
    volumes:
      - mysql_slave2_data:/var/lib/mysql
      - ./mysql/init/slave:/docker-entrypoint-initdb.d:ro
      - ./mysql/runtime/semi_sync_slave.sql:/etc/mysql/semi_sync_init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password --transaction-isolation=READ-COMMITTED --server-id=3 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --max-connections=1000 --read-only=1 --super-read-only=1 --init-file=/etc/mysql/semi_sync_init.sql
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # mysqld-exporter MySQL 指标导出（连接 mysql-master）
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    restart: always
    ports:
      - "9104:9104"
    environment:
      TZ: Asia/Shanghai
    command:
      - --mysqld.address=mysql-master:3306
      - --mysqld.username=exporter:exporter123456
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Redis 6 主节点 (读写)
  redis-master:
    image: redis:6-alpine
    container_name: redis-master
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_master_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev_pay_net

  # Redis 6 从节点1 (只读副本, 通过 replicaof 复制主节点)
  redis-slave1:
    image: redis:6-alpine
    container_name: redis-slave1
    restart: always
    ports:
      - "6380:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_slave1_data:/data
    command: redis-server --appendonly yes --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Redis 6 从节点2 (只读副本, 通过 replicaof 复制主节点)
  redis-slave2:
    image: redis:6-alpine
    container_name: redis-slave2
    restart: always
    ports:
      - "6381:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_slave2_data:/data
    command: redis-server --appendonly yes --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Redis Sentinel 哨兵1 (负责监控+投票+故障转移)
  redis-sentinel1:
    image: redis:6-alpine
    container_name: redis-sentinel1
    restart: always
    ports:
      - "26379:26379"
    environment:
      TZ: Asia/Shanghai
    # 挂载独立配置文件(哨兵运行时会重写该文件), 故不加 :ro
    volumes:
      - ./redis/runtime/sentinel1.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Redis Sentinel 哨兵2
  redis-sentinel2:
    image: redis:6-alpine
    container_name: redis-sentinel2
    restart: always
    ports:
      - "26380:26379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./redis/runtime/sentinel2.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Redis Sentinel 哨兵3
  redis-sentinel3:
    image: redis:6-alpine
    container_name: redis-sentinel3
    restart: always
    ports:
      - "26381:26379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./redis/runtime/sentinel3.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - dev_pay_net

  # Etcd 3.5 分布式注册中心【新增command解决报错】
  # etcd 节点1 (3节点集群: etcd + etcd2 + etcd3, 静态发现)
  etcd:
    image: registry.aliyuncs.com/google_containers/etcd:3.5.6-0
    container_name: etcd
    restart: always
    ports:
      - "2379:2379" # 客户端端口 (保持原端口, 业务服务配置不变)
      - "2380:2380" # 节点间通信端口
    environment:
      TZ: Asia/Shanghai
      ALLOW_NONE_AUTHENTICATION: yes
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      # 3 节点集群静态成员列表, 三个节点必须一致
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-dev
    volumes:
      - etcd1_data:/etcd/data
    # 关键修复：添加etcd启动命令
    command:
      - /usr/local/bin/etcd
    networks:
      - dev_pay_net

  # etcd 节点2 (宿主机端口 2479/2480)
  etcd2:
    image: registry.aliyuncs.com/google_containers/etcd:3.5.6-0
    container_name: etcd2
    restart: always
    ports:
      - "2479:2379"
      - "2480:2380"
    environment:
      TZ: Asia/Shanghai
      ALLOW_NONE_AUTHENTICATION: yes
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-dev
    volumes:
      - etcd2_data:/etcd/data
    command:
      - /usr/local/bin/etcd
    networks:
      - dev_pay_net

  # etcd 节点3 (宿主机端口 2579/2580)
  etcd3:
    image: registry.aliyuncs.com/google_containers/etcd:3.5.6-0
    container_name: etcd3
    restart: always
    ports:
      - "2579:2379"
      - "2580:2380"
    environment:
      TZ: Asia/Shanghai
      ALLOW_NONE_AUTHENTICATION: yes
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /etcd/data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-dev
    volumes:
      - etcd3_data:/etcd/data
    command:
      - /usr/local/bin/etcd
    networks:
      - dev_pay_net

  # Kafka 3.8.0 节点1 (KRaft combined: 同时承担 broker + controller)
  kafka1:
    image: apache/kafka:3.8.0
    container_name: kafka1
    restart: always
    ports:
      - "9092:9092" # 宿主机客户端连接
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: kafka-cluster-001 # 三个节点必须相同
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: 节点间复制; EXTERNAL: 宿主机访问; CONTROLLER: KRaft 选举
      KAFKA_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 3 节点 controller 投票集合(容器网络内均用 9093)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # 分区默认 3 副本, 任一节点宕机不丢数据
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # 至少 2 副本同步成功才确认写入
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka1_data:/tmp/kraft-combined-logs
    user: root
    networks:
      - dev_pay_net

  # Kafka 3.8.0 节点2
  kafka2:
    image: apache/kafka:3.8.0
    container_name: kafka2
    restart: always
    ports:
      - "9093:9092" # 容器内 EXTERNAL 9092 -> 宿主机 9093
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 2
      KAFKA_CLUSTER_ID: kafka-cluster-001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://127.0.0.1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka2_data:/tmp/kraft-combined-logs
    user: root
    networks:
      - dev_pay_net

  # Kafka 3.8.0 节点3
  kafka3:
    image: apache/kafka:3.8.0
    container_name: kafka3
    restart: always
    ports:
      - "9097:9092" # 容器内 EXTERNAL 9092 -> 宿主机 9097 (9094/9095/9096 被业务容器占用)
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 3
      KAFKA_CLUSTER_ID: kafka-cluster-001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://127.0.0.1:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka3_data:/tmp/kraft-combined-logs
    user: root
    networks:
      - dev_pay_net

  # mysqld-exporter 采集 MySQL 从库1指标 (容器内仍监听 9104, 宿主映射 9105)
  mysqld-exporter-slave1:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-slave1
    restart: always
    ports:
      - "9105:9104"
    environment:
      TZ: Asia/Shanghai
    command:
      - --mysqld.address=mysql-slave1:3306
      - --mysqld.username=exporter:exporter123456
    depends_on:
      - mysql-slave1
    networks:
      - dev_pay_net

  # mysqld-exporter 采集 MySQL 从库2指标 (宿主映射 9106)
  mysqld-exporter-slave2:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-slave2
    restart: always
    ports:
      - "9106:9104"
    environment:
      TZ: Asia/Shanghai
    command:
      - --mysqld.address=mysql-slave2:3306
      - --mysqld.username=exporter:exporter123456
    depends_on:
      - mysql-slave2
    networks:
      - dev_pay_net

  # redis-exporter 采集 Redis 集群指标。
  # 不设 REDIS_ADDR 即进入 multi-target 模式: Prometheus 通过 /scrape?target=<addr>
  # 用同一个 exporter 代理采集 主/从/哨兵 全部节点, 无需为每个节点起容器。
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    restart: always
    ports:
      - "9121:9121"
    environment:
      TZ: Asia/Shanghai
    command:
      - --web.listen-address=0.0.0.0:9121
    networks:
      - dev_pay_net

  # kafka-exporter 采集 Kafka 集群指标 (通过 Kafka 协议, 无需 JMX)
  # 一个 exporter 同时连 3 个 broker, 自动发现 topic/分区/副本/消费组
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: always
    ports:
      - "9308:9308"
    environment:
      TZ: Asia/Shanghai
    command:
      - --kafka.server=kafka1:29092
      - --kafka.server=kafka2:29092
      - --kafka.server=kafka3:29092
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - dev_pay_net

  # Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: always
    ports:
      - "9091:9090" # 宿主机访问 http://localhost:9091
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - dev_pay_net

  # Grafana 可视化面板
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: always
    ports:
      - "31000:3000" # 宿主机访问 http://localhost:3000
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - graf_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - dev_pay_net

  # Loki 日志存储
  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    restart: always
    ports:
      - "3100:3100" # Loki API
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dev_pay_net

  # Promtail 日志采集
  promtail:
    image: grafana/promtail:2.9.10
    container_name: promtail
    restart: always
    ports:
      - "9080:9080" # Promtail Web UI
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - dev_pay_net

  # Tempo 链路追踪
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    restart: always
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports:
      - "3200:3200" # Tempo API (查询接口)
      - "4317:4317" # OTLP gRPC (go-zero 发送 trace)
      - "4318:4318" # OTLP HTTP (go-zero 发送 trace)
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - dev_pay_net
