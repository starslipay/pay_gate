# Redis Sentinel 哨兵配置
# 3 个哨兵容器内部均监听 26379 端口(各自独立网络命名空间), 靠宿主机映射端口区分。
port 26379
dir /tmp
# 启用 hostname 解析, 否则 sentinel monitor 中只能用 IP 不能用主机名
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# 监控名为 mymaster 的主节点: redis-master:6379
# 末尾的 2 是 quorum(判定客观下线并触发故障转移所需的哨兵票数), 3 节点设 2。
sentinel monitor mymaster redis-master 6379 2

# 主观下线判定: 5 秒内无有效响应则认为该节点疑似下线
sentinel down-after-milliseconds mymaster 5000

# 故障转移超时时间: 30 秒
sentinel failover-timeout mymaster 30000

# 故障转移时每次只让 1 个从节点向新主节点同步, 避免多个从节点同时全量同步压垮新主
sentinel parallel-syncs mymaster 1
